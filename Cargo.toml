[package]
name = "rpgui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
libc = "0.2"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3"

[profile.dev]
debug = 1
